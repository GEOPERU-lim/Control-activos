<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Activos - GEOPERU</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004085;
            --bg: #f8f9fa;
            --text: #333;
            --border: #dee2e6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f1f3f5;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f9fbfd;
        }
        .actions-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
        .actions-btn:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistema de Control de Activos - GEOPERU</h1>
    
    <!-- Formulario para agregar activos -->
    <form id="assetForm">
        <div class="grid-form">
            <div class="form-group">
                <label for="assetCode">Código de Activo</label>
                <input type="text" id="assetCode" required placeholder="Ej: ACT-001">
            </div>
            <div class="form-group">
                <label for="assetName">Nombre del Activo</label>
                <input type="text" id="assetName" required placeholder="Ej: Laptop HP">
            </div>
            <div class="form-group">
                <label for="assetCategory">Categoría</label>
                <select id="assetCategory">
                    <option value="Equipos Cómputo">Equipos Cómputo</option>
                    <option value="Mobiliario">Mobiliario</option>
                    <option value="Herramientas">Herramientas</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
            <div class="form-group">
                <label for="assetUser">Usuario Asignado</label>
                <input type="text" id="assetUser" required placeholder="Ej: Logística">
            </div>
        </div>
        <button type="submit">Registrar Activo</button>
    </form>

    <!-- Tabla donde se muestran los datos en tiempo real -->
    <table id="assetsTable">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Usuario Asignado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="assetsTableBody">
            <!-- Los datos se cargarán aquí dinámicamente -->
        </tbody>
    </table>
</div>

<!-- Scripts de Firebase (Versión de compatibilidad para ambiente Web directo) -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // Configuración con los datos reales de tu pantalla de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCxqPVVIOesj_R7tfs6iVKxIXd94z3elM",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebaseio.com",
        projectId: "geoperu-e8206",
        storageBucket: "://appspot.com",
        messagingSenderId: "566406328473",
        appId: "1:566406328473:web:51c7862d5ec981ebc808"
    };

    // Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const assetForm = document.getElementById('assetForm');
    const assetsTableBody = document.getElementById('assetsTableBody');

    // Escuchar cambios de la Base de Datos EN TIEMPO REAL
    db.ref('activos').on('value', (snapshot) => {
        assetsTableBody.innerHTML = '';
        const data = snapshot.val();
        
        if (data) {
            Object.keys(data).forEach((key) => {
                const asset = data[key];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${asset.code}</td>
                    <td>${asset.name}</td>
                    <td>${asset.category}</td>
                    <td>${asset.user}</td>
                    <td>
                        <button class="actions-btn" onclick="deleteAsset('${key}')">Eliminar</button>
                    </td>
                `;
                assetsTableBody.appendChild(row);
            });
        } else {
            assetsTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No hay activos registrados</td></tr>`;
        }
    });

    // Guardar nuevo activo en la nube
    assetForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const newAsset = {
            code: document.getElementById('assetCode').value,
            name: document.getElementById('assetName').value,
            category: document.getElementById('assetCategory').value,
            user: document.getElementById('assetUser').value
        };

        // Empujar datos a Firebase
        db.ref('activos').push(newAsset)
            .then(() => {
                assetForm.reset();
            })
            .catch((error) => {
                alert("Error al guardar: " + error.message);
            });
    });

    // Función para eliminar un activo de la nube
    window.deleteAsset = function(key) {
        if(confirm("¿Estás seguro de eliminar este activo?")) {
            db.ref('activos/' + key).remove();
        }
    }
</script>
</body>
</html>
