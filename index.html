<!doctype html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Activos (Visor)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f9;--cd:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#e1e5ed;--pr:#2a4d8f;--ac:#2a4d8f;--sb:#12203b;--ti:#12203b;--hv:#f0f3f9;--g:#2e9e5b;--y:#d99a00;--r:#d64545;--n:#8a94a3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--cd:#18213a;--tx:#e6eaf3;--mu:#9aa5b8;--bd:#2a3555;--pr:#7ea3ec;--ac:#7ea3ec;--sb:#0a101e;--ti:#a9bff0;--hv:#222d4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--cd:#18213a;--tx:#e6eaf3;--mu:#9aa5b8;--bd:#2a3555;--pr:#7ea3ec;--ac:#7ea3ec;--sb:#0a101e;--ti:#a9bff0;--hv:#222d4a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{font:14px Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
.hd{position:sticky;top:0;z-index:20;min-height:54px;background:var(--cd);border-bottom:3px solid var(--sb);display:flex;align-items:center;gap:12px;padding:6px 14px;box-shadow:0 2px 6px rgba(18,32,59,.08)}
.logo{width:36px;height:36px;border-radius:8px;flex:none}.hd h1{font-size:17px;margin:0;color:var(--ti);line-height:1.1}.mu{color:var(--mu);font-size:12px}.sp{flex:1}
.ib{width:36px;height:36px;font-size:18px;color:var(--ti);padding:0}
.lay{display:flex;align-items:flex-start}
.sb{width:230px;flex:none;background:var(--sb);color:#fff;padding:12px 8px;display:flex;flex-direction:column;gap:3px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sb a{display:flex;align-items:center;gap:10px;border-left:3px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;color:#c9d3e6;white-space:nowrap}
.sb a:hover{background:rgba(255,255,255,.1);color:#fff}.sb a.on{background:rgba(255,255,255,.14);border-left-color:#7ea3ec;color:#fff;font-weight:600}
.ic{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:rgba(255,255,255,.1)}
.sec{font-size:11px;color:#8fa0bd;text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 4px}
body.col .sb{width:66px}body.col .lb,body.col .sec{display:none}body.col .sb a{justify-content:center;padding:7px 0}
.mn{flex:1;min-width:0;padding:20px;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}h2{margin:0;font-size:20px;color:var(--ti)}
.bd{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--bd);color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--c,var(--pr));border-radius:10px;padding:12px 14px}.k b{display:block;font-size:26px;color:var(--ti)}.k span{color:var(--mu);font-size:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:16px;overflow-x:auto}.cd h3{margin:0 0 10px;font-size:14px;color:var(--ti)}
table{width:100%;border-collapse:collapse;min-width:700px}th{text-align:left;font-size:11px;color:var(--mu);text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--bd)}td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}tr:hover>td{background:var(--hv)}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--c)}.g{--c:var(--g)}.y{--c:var(--y)}.r{--c:var(--r)}.n{--c:var(--n)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--hv);color:var(--mu)}
.tag[data-s="Asignado"]{background:#e2f4e9;color:#237a46}.tag[data-s="En stock"]{background:#e3ebf8;color:#2a4d8f}.tag[data-s="En reparación"]{background:#fcefd0;color:#8a6200}.tag[data-s="Dado de baja"]{background:#fbe5e5;color:#b13a3a}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px}button{cursor:pointer}button:hover{background:var(--hv)}
button.pr{background:var(--pr);color:#fff;border-color:var(--pr)}button.pr:hover{filter:brightness(1.12)}button.sm{padding:3px 8px;font-size:12px}button.dg{color:var(--r)}
.tl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{height:12px;border-radius:6px;background:var(--pr);display:block}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(460px,94vw);padding:20px;max-height:90vh;overflow:auto}dialog.wd{width:min(780px,94vw)}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}dialog input,dialog select,dialog textarea{width:100%}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px;margin-top:4px}.fg .w{grid-column:1/-1}
@media(max-width:700px){.mn{padding:12px}}
</style></head><body>

function dlf(n,b){if(dl)dl.save({filename:n,data:b}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}}

function cv(o){if(!o.assets.some(a=>'code' in a))return{aviso:o.aviso||15,assets:o.assets,hist:o.hist||[]};return{aviso:15,assets:o.assets.map(a=>{const d=+a.freq||0;return{c:a.code,t:a.type,n:a.model||'',m:a.brand||'',s:a.serial||'',ln:a.line||'',u:'',r:a.user||'',ar:a.area||'',e:a.status||'',since:a.since||'',l:a.last||'',f:d?Math.max(1,Math.round(d/30)):0,nt:a.notes||''}}),hist:(o.history||[]).map(h=>({d:String(h.ts||'').slice(0,10),c:h.code,k:h.act,w:'',p:0,o:h.det||''}))}}
function rs(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o.assets)throw 0;dlg('Abrir archivo','<p>Se reemplazarán los datos actuales por los del archivo ('+o.assets.length+' activos). ¿Continuar?</p>',()=>{D=cv(o)},'Reemplazar')}).catch(()=>al('Archivo no válido'));e.target.value=''}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();bk()}});
function render(){$('#cnt').textContent=D.assets.length+' activos';$('#aop').style.display=ed?'':'none';document.querySelectorAll('.sb a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==view));
const R=D.assets.map(a=>({a,r:st(a)}));let h=`<div class="top"><h2>${{p:'Panel de control',a:'Activos',h:'Historial de mantenimientos'}[view]}</h2><span class="bd">${role} · ${ed?'puede editar':'solo lectura'} · ${fd(hoy())}</span> <span class="bd" id="sy">${E(sy.t||(db?'Conectando…':'✗ Sin conexión'))}</span></div>`;
if(view=='p'){const cnt=k=>R.filter(x=>x.r.s==k).length,tipos={};R.forEach(x=>tipos[x.a.t]=(tipos[x.a.t]||0)+1);const mx=Math.max(1,...Object.values(tipos)),us={};R.forEach(x=>{if(x.a.r&&x.a.e=='Asignado')us[x.a.r]=(us[x.a.r]||0)+1});const m2=Math.max(1,...Object.values(us));
h+=`<div class="kp">${[['Total activos',R.length,'var(--pr)'],['Asignados',D.assets.filter(a=>a.e=='Asignado').length,'var(--pr)'],['Al día',cnt('AL DÍA'),'var(--g)'],['Por vencer',cnt('POR VENCER'),'var(--y)'],['Vencidos',cnt('VENCIDO'),'var(--r)'],['Sin datos',cnt('SIN DATOS'),'var(--n)']].map(k=>`<div class="k" style="--c:${k[2]}"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
<div class="cd"><h3>Próximos mantenimientos (vencidos primero)</h3><table><tr><th>Código</th><th>Equipo</th><th>Ubicación</th><th>Próximo</th><th>Días</th><th>Estado</th></tr>${R.filter(x=>!['SIN DATOS','N/A'].includes(x.r.s)).sort((a,b)=>a.r.o-b.r.o).slice(0,8).map(x=>`<tr><td><b>${E(x.a.c)}</b></td><td>${E(x.a.n)}</td><td>${E(x.a.u)}</td><td>${fd(x.r.x)}</td><td>${x.r.n}</td><td>${pill(x.r)}</td></tr>`).join('')||'<tr><td colspan=6>Sin datos</td></tr>'}</table></div>
<div class="cd"><h3>Activos por tipo</h3>${Object.entries(tipos).map(([t,n])=>`<div class="bar"><span style="width:150px">${E(t)}</span><i style="width:${n/mx*60}%"></i><b>${n}</b></div>`).join('')}</div><div class="cd"><h3>Equipos por usuario</h3>${Object.entries(us).sort().map(([t,n])=>`<div class="bar"><span style="width:150px">${E(t)}</span><i style="width:${n/m2*60}%"></i><b>${n}</b></div>`).join('')||'<span class="mu">Sin datos</span>'}</div>`}
if(view=='a'){const L=R.filter(x=>(!fl||x.a.t==fl)&&(!fe||x.a.e==fe)&&JSON.stringify(x.a).toLowerCase().includes(q.toLowerCase()));
h+=`<div class="tl"><input id="q" placeholder="Buscar…" value="${E(q)}"><select id="fl"><option value="">Todos los tipos</option>${tp().map(s=>`<option ${fl==s?'selected':''}>${E(s)}`).join('')}</select><select id="fe"><option value="">Todos los estados</option>${ESTADOS.map(s=>`<option ${fe==s?'selected':''}>${s}`).join('')}</select>${ed?`<button class="pr" onclick="fa()">+ Nuevo activo</button><button onclick="$('#xi').click()">Importar Excel</button><button onclick="pg()">Pegar datos</button><input id="xi" type="file" accept=".xlsx,.xls,.csv" hidden>`:''}</div>
<div class="cd"><table><tr><th>Código</th><th>Equipo</th><th>Usuario asignado</th><th>Estado</th><th>Mantenimiento</th>${ed?'<th></th>':''}</tr>${L.map(x=>{const a=x.a,cl=E(a.c);return`<tr><td><b>${cl}</b><div class="mu">${E(a.t)}</div></td><td>${E(a.m)} ${E(a.n)}<div class="mu">${a.t=='Celular'?'IMEI ':'S/N '}${E(a.s||'—')}${a.ln?' · Línea '+E(a.ln):''}${a.u?' · '+E(a.u):''}</div></td><td>${a.r?E(a.r)+'<div class="mu">'+E(a.ar||'')+' · desde '+fi(a.since)+'</div>':'<span class="mu">Sin asignar</span>'}</td><td><span class="tag" data-s="${E(a.e)}">${E(a.e||'—')}</span></td><td>${pill(x.r)}<div class="mu">${a.t=='Celular'?'':'Último: '+fi(a.l)+' · Próx: '+fd(x.r.x)}</div></td>${ed?`<td style="white-space:nowrap">${x.r.s=='N/A'?'':`<button class="sm pr" onclick="fh('${cl}')">Hecho</button> `}<button class="sm" onclick="fa('${cl}')">Editar</button> <button class="sm dg" onclick="da('${cl}')">✕</button></td>`:''}</tr>`}).join('')||'<tr><td colspan=6>Sin resultados</td></tr>'}</table></div>`}
if(view=='h')h+=`<div class="cd"><table><tr><th>Fecha</th><th>Código</th><th>Equipo</th><th>Tipo</th><th>Técnico</th><th>Costo S/</th><th>Observaciones</th></tr>${[...D.hist].sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<tr><td>${fi(x.d)}</td><td><b>${E(x.c)}</b></td><td>${E((D.assets.find(a=>a.c==x.c)||{}).n)}</td><td>${E(x.k)}</td><td>${E(x.w)}</td><td>${(+x.p||0).toFixed(2)}</td><td>${E(x.o)}</td></tr>`).join('')||'<tr><td colspan=7>Sin registros</td></tr>'}</table></div>`;
$('#app').innerHTML=h;const qi=$('#q');if(qi){qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)};$('#fl').onchange=e=>{fl=e.target.value;render()};$('#fe').onchange=e=>{fe=e.target.value;render()}}const xi=$('#xi');if(xi)xi.onchange=im;const ri=$('#ri');if(ri)ri.onchange=rs}
function dlg(t,body,ok,lb){const m=$('#m');m.className=body.includes('class="fg"')?'wd':'';m.innerHTML=`<h3 style="margin:0 0 6px">${t}</h3>${body}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button onclick="$('#m').close()">Cancelar</button><button class="pr" id="ok">${lb||'Guardar'}</button></div>`;$('#ok').onclick=()=>{if(ok()!==false){m.close();save()}};m.showModal()}
const V=i=>$('#'+i).value.trim();
function fa(c){const a=D.assets.find(x=>x.c==c)||{t:'Laptop',f:6,e:'Asignado',since:iso(hoy()),c:nc()},i=(k,l,t)=>`<div><label>${l}</label><input id="f_${k}" type="${t||'text'}" value="${E(a[k])}"></div>`;
dlg(c?'Editar activo':'Nuevo activo','<div class="fg">'+i('c','Código')+`<div><label>Tipo de equipo</label><select id="f_t">${tp().map(t=>`<option ${t==a.t?'selected':''}>${E(t)}`).join('')}</select></div><div><label>¿No está el tipo? Escríbalo aquí</label><input id="f_t2" placeholder="Ej: Proyector"></div>`+i('m','Marca')+i('n','Modelo / descripción')+i('s','Serie / IMEI')+i('ln','N° de línea (celulares)')+i('u','Ubicación')+i('r','Usuario asignado')+i('ar','Área / departamento')+`<div><label>Estado</label><select id="f_e">${ESTADOS.map(t=>`<option ${t==a.e?'selected':''}>${t}`).join('')}</select></div>`+i('since','Fecha de asignación','date')+i('l','Último mantenimiento','date')+i('f','Frecuencia (meses)','number')+i('nt','Notas').replace('<div>','<div class="w">')+'</div>',()=>{const g=k=>V('f_'+k),n={c:g('c'),t:g('t2')||g('t'),n:g('n'),m:g('m'),s:g('s'),ln:g('ln'),u:g('u'),r:g('r'),ar:g('ar'),e:g('e'),since:g('since'),l:g('l'),f:+g('f')||0,nt:g('nt')};if(n.e=='No asignado')n.r='';if(!n.c)return al('Falta el código'),false;if(n.c!=c&&D.assets.some(x=>x.c==n.c))return al('Ese código ya existe'),false;lg(n.c,c?'Edición':'Alta',(n.t+' '+n.m+' '+n.n).trim());if(c){const i=D.assets.findIndex(x=>x.c==c);D.assets[i]=n;D.hist.forEach(h=>{if(h.c==c)h.c=n.c})}else D.assets.push(n)})}
function da(c){dlg('Eliminar '+c,'<p>¿Seguro que desea eliminar este activo? Su historial se conserva.</p>',()=>{lg(c,'Baja','Activo eliminado');D.assets=D.assets.filter(x=>x.c!=c)},'Eliminar')}

function ex(){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Código','Tipo','Marca','Modelo','Serie/IMEI','Línea','Ubicación','Usuario','Área','Estado','Fecha asignación','Último mant.','Frecuencia (meses)','Próximo','Estado mant.','Notas'],...D.assets.map(a=>{const r=st(a);return[a.c,a.t,a.m,a.n,a.s,a.ln,a.u,a.r,a.ar,a.e,a.since,a.l,a.f,r.x?iso(r.x):'',r.s,a.nt]})]),'Activos');XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Fecha','Código','Tipo de trabajo','Técnico','Costo','Observaciones'],...D.hist.map(h=>[h.d,h.c,h.k,h.w,h.p,h.o])]),'Historial');
if(!dl)return al('La descarga no está disponible en esta vista.');dl.save({filename:'Control_de_Activos.xlsx',data:new Blob([XLSX.write(w,{type:'array',bookType:'xlsx'})])}).catch(()=>{})}
function ing(rows){const dt=v=>v instanceof Date?iso(v):String(v),ok=v=>{v=String(v).trim();const m=/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/.exec(v);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):''};let n=0;rows.forEach(r=>{const K=Object.keys(r),g=re=>{const k=K.find(k=>re.test(k.toLowerCase()));return k?r[k]:''},fk=K.find(k=>/frec/i.test(k))||'',fv=+g(/frec/)||0,c=String(g(/c[oó]d/)).trim();if(!c)return;const a={c,t:g(/tipo/)||'Otro',m:g(/marca/),n:g(/modelo|equipo|descr/),s:g(/serie|imei/),ln:g(/l[ií]nea/),u:g(/ubic/),r:g(/usuario/),ar:g(/[aá]rea/),e:g(/estado/)||'Asignado',since:ok(dt(g(/fecha.*asig|desde/))),l:ok(dt(g(/[uú]ltim/))),f:/d[ií]a/i.test(fk)?Math.max(1,Math.round(fv/30)):fv,nt:g(/nota/)},i=D.assets.findIndex(x=>x.c==c);i<0?D.assets.push(a):D.assets[i]=a;n++});if(n)lg('—','Importación',n+' activos');al(n?n+' activos importados':'No encontré la columna "Código". Revise los títulos de la primera fila.');save()}
async function im(e){const f=e.target.files[0];if(!f)return;if(typeof XLSX=='undefined')return al('La librería de Excel no cargó. Use "Pegar datos".');try{const w=XLSX.read(await f.arrayBuffer(),{cellDates:true});ing(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}))}catch(x){al('No se pudo leer el archivo')}e.target.value=''}
function pg(){dlg('Pegar datos desde Excel','<p class="mu">En Excel seleccione las filas con la fila de títulos (Código, Tipo, Marca, Modelo, Serie, Usuario, Área, Estado, Último mantenimiento, Frecuencia), cópielas y péguelas aquí.</p><textarea id="pgx" rows="8"></textarea>',()=>{const t=$('#pgx').value,ls=t.split(/\r?\n/).filter(x=>x.trim());if(ls.length<2)return al('Pegue la fila de títulos y al menos un equipo'),false;const d=ls[0].includes('\t')?'\t':ls[0].includes(';')?';':',',H=ls[0].split(d).map(x=>x.trim());ing(ls.slice(1).map(l=>{const c=l.split(d),o={};H.forEach((h,i)=>o[h]=(c[i]||'').trim());return o}))},'Importar')}
document.querySelectorAll('.sb a[data-v]').forEach(a=>a.onclick=()=>{view=a.dataset.v;render()});sy.t='👁 Vista compartida · datos al 05/11/2026';$('#bg').onclick=()=>document.body.classList.toggle('col');$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'};if(innerWidth<800)document.body.classList.add('col');render();
(async()=>{try{const u=await claude.use('user');db=await claude.use('db');dl=await claude.use('downloads');if(u){if(await u.isOwner()){role='Propietario';ed=true}else if(await u.canEdit()){role='Editor';ed=true}}
if(db)db.doc('state/main').onSnapshot(x=>{if(x.exists)D=JSON.parse(JSON.stringify(x.data()));if(!sy.t||/Conectado|Sin conexi/.test(sy.t))sy.t='✓ Conectado · se guarda solo';render()},e=>al('Error de lectura: '+(e.code||e.message)))}catch(x){}render()})();
