<html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGL · Sistema de Gestión Logística</title>
<script>
addEventListener('error',function(e){var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;padding:10px 14px;font:13px Arial,sans-serif';(document.body||document.documentElement).appendChild(b)}b.textContent='ERROR EN LA PAGINA: '+(e.message||'desconocido')+(e.lineno?' (linea '+e.lineno+')':'')+'. Envie una captura de este aviso.'});

<script src="https://cloudflare.com"></script>
<style>
:root{--bg:#f3f5f9;--cd:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#e1e5ed;--pr:#2a4d8f;--ac:#2a4d8f;--sb:#12203b;--ti:#12203b;--hv:#f0f3f9;--g:#2e9e5b;--y:#d99a00;--r:#d64545;--n:#8a94a3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--cd:#18213a;--tx:#e6eaf3;--mu:#9aa5b8;--bd:#2a3555;--pr:#7ea3ec;--ac:#7ea3ec;--sb:#0a101e;--ti:#a9bff0;--hv:#222d4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--cd:#18213a;--tx:#e6eaf3;--mu:#9aa5b8;--bd:#2a3555;--pr:#7ea3ec;--ac:#7ea3ec;--sb:#0a101e;--ti:#a9bff0;--hv:#222d4a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{font:14px Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
.hd{position:sticky;top:0;z-index:20;min-height:54px;background:var(--cd);border-bottom:3px solid var(--sb);display:flex;align-items:center;gap:12px;padding:6px 14px;box-shadow:0 2px 6px rgba(18,32,59,.08)}
.logo{width:36px;height:36px;border-radius:8px;flex:none}.hd h1{font-size:17px;margin:0;color:var(--ti);line-height:1.1}.mu{color:var(--mu);font-size:12px}.sp{flex:1}
.ib{width:36px;height:36px;font-size:18px;color:var(--ti);padding:0}
.lay{display:flex;align-items:flex-start}
.sb{width:235px;flex:none;background:var(--sb);color:#fff;padding:12px 8px;display:flex;flex-direction:column;gap:3px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sb a{display:flex;align-items:center;gap:10px;border-left:3px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;color:#c9d3e6;white-space:nowrap}
.sb a:hover{background:rgba(255,255,255,.1);color:#fff}.sb a.on{background:rgba(255,255,255,.14);border-left-color:#7ea3ec;color:#fff;font-weight:600}
.ic{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:rgba(255,255,255,.1)}
.sec{font-size:11px;color:#8fa0bd;text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 4px}
.sbf{margin-top:auto;padding:12px 10px 4px;font-size:10px;color:#5a6b8a;text-align:center;letter-spacing:.04em}
body.col .sb{width:66px}body.col .lb,body.col .sec,body.col .sbf{display:none}body.col .sb a{justify-content:center;padding:7px 0}
.mn{flex:1;min-width:0;padding:20px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}h2{margin:0;font-size:20px;color:var(--ti)}
.bd{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--bd);color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--c,var(--pr));border-radius:10px;padding:12px 14px}.k b{display:block;font-size:26px;color:var(--ti)}.k span{color:var(--mu);font-size:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:16px;overflow-x:auto}.cd h3{margin:0 0 10px;font-size:14px;color:var(--ti)}
table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;font-size:11px;color:var(--mu);text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--bd)}td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}tr:hover>td{background:var(--hv)}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--c)}.g{--c:var(--g)}.y{--c:var(--y)}.r{--c:var(--r)}.n{--c:var(--n)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--hv);color:var(--mu)}
.tag[data-s="Asignado"],.tag[data-s="Entregado"],.tag[data-s="Activo"]{background:#e2f4e9;color:#237a46}.tag[data-s="En stock"],.tag[data-s="Emitido"]{background:#e3ebf8;color:#2a4d8f}.tag[data-s="En reparación"],.tag[data-s="En Picking"]{background:#fcefd0;color:#8a6200}.tag[data-s="Dado de baja"],.tag[data-s="Inactivo"]{background:#fbe5e5;color:#b13a3a}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px}button{cursor:pointer}button:hover{background:var(--hv)}
button.pr{background:var(--pr);color:#fff;border-color:var(--pr)}button.pr:hover{filter:brightness(1.12)}button.sm{padding:4px 8px;font-size:12px}button.dg{color:var(--r)}
.tl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{height:12px;border-radius:6px;background:var(--pr);display:block}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(480px,95vw);padding:20px;max-height:92vh;overflow:auto}dialog.wd{width:min(820px,95vw)}dialog.xl{width:min(1020px,96vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}dialog input,dialog select,dialog textarea{width:100%}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px;margin-top:4px}.fg .w{grid-column:1/-1}
.box{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:12px;background:rgba(127,127,127,.04)}
.box-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.box-hd h4{margin:0;font-size:14px;color:var(--ti)}
.sub-row{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--cd)}
@media(max-width:700px){.mn{padding:12px}}
#rep{display:none}
.hm{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;max-width:960px}.hc{background:var(--cd);border:1px solid var(--bd);border-top:4px solid var(--pr);border-radius:14px;padding:22px;cursor:pointer;transition:transform .15s,box-shadow .15s}.hc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25)}.hc .hi{font-size:36px}.hc h3{margin:8px 0 4px;font-size:18px;color:var(--ti)}.hc p{margin:0 0 12px;color:var(--mu)}.hc b{color:var(--ti)}
td a{color:var(--pr);text-decoration:none}input[type=checkbox]{width:17px;height:17px;padding:0;accent-color:var(--pr);cursor:pointer}.ck label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);cursor:pointer;margin:6px 0}table.wide{min-width:1500px}tr.bj>td{opacity:.55}
#lg{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}.lgc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:26px;width:min(380px,100%);box-shadow:0 10px 30px rgba(0,0,0,.35)}.lgc img{width:56px;height:56px;border-radius:12px}.lgc h2{margin:10px 0 4px}.lgc label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}.lgc input{width:100%}.lgc .er{color:var(--r);font-size:13px;margin-top:10px;min-height:18px}.lgc button.pr{width:100%;margin-top:14px;padding:10px}.lgc .lk{background:none;border:0;color:var(--pr);font-size:12px;margin-top:10px;cursor:pointer;padding:0;text-decoration:underline}

/* Portal Público Cliente */
#pub{display:none;min-height:100vh;background:#f3f5f9;color:#1b2433;padding:20px}
.pub-wrap{max-width:960px;margin:0 auto;background:#fff;border:1px solid #dce1eb;border-radius:12px;padding:24px;box-shadow:0 6px 24px rgba(18,32,59,.08)}
.pub-wrap table{min-width:0}

/* Estilos de Impresión PDF */
@media print{
  @page{size:A4 portrait;margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important}
  body>*:not(#rep){display:none!important}
  #rep{display:block;color:#000;font:11px Arial,Helvetica,sans-serif}
  #rep.land{@page{size:A4 landscape}}
  #rep .rh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #12203b;padding-bottom:8px;margin-bottom:8px}
  #rep .rh img{width:48px;height:48px;border-radius:8px}
  #rep h1{font-size:18px;margin:0;color:#12203b}
  #rep .rs{margin:6px 0 10px;color:#333;line-height:1.6}
  #rep table{width:100%;border-collapse:collapse;min-width:0}
  #rep th{background:#12203b;color:#fff;font-size:9.5px;text-align:left;padding:5px 6px;text-transform:uppercase;border:0}
  #rep td{border-bottom:1px solid #ccc;padding:4px 6px;font-size:10px;color:#000;background:#fff}
  #rep tr{break-inside:avoid}
  #rep thead{display:table-header-group}

  /* Formato Oficial Packing List */
  .pl-box{border:1.5px solid #000;width:100%;border-collapse:collapse;margin-bottom:6px}
  .pl-box td,.pl-box th{border:1px solid #000!important;padding:5px 7px!important;font-size:10.5px!important;color:#000!important;background:#fff!important}
  .pl-box th{background:#e9edf5!important;color:#000!important;font-weight:700!important;text-align:center!important;text-transform:none!important}
  .pl-sub{background:#f2f4f8!important;font-weight:700!important}
  .pl-desc{white-space:pre-line;line-height:1.35}
  .pl-foot{margin-top:8px;font-size:8.5px;color:#666;text-align:right}
}
</style></head><body>
